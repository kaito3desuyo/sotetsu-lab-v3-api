version: '3.7'

networks:
    development-network:

services:
    development-api:
        build:
            context: .
            target: development-base
        ports:
            - '3000:3000'
        tty: true
        command: sh -c "npm run start:dev"
        volumes:
            - .:/home/node/sotetsu-lab-v3-api
            - /home/node/sotetsu-lab-v3-api/node_modules
        networks:
            - development-network
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        env_file:
            - .env.local
